<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Construye al robot! - Piensa y Ordena</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="actividad6">

  <main id="app">
    <section class="interna" aria-labelledby="titulo-pagina">
      <div class="tarjeta">
        <p class="etiqueta-seccion">Juego</p>
        <div class="juego-cabecera">
          <h2 id="titulo-pagina">¡Construye al robot!</h2>
          <ol id="niveles" class="niveles" aria-label="Robots"></ol>
        </div>

        <div class="camino">
          <div class="zona-tablero">
            <div id="taller" class="taller" aria-label="Taller del robot">
              <div id="modelo" class="modelo" aria-label="Así debe quedar" hidden></div>
            </div>
            <div class="personaje compacto">
              <img id="pixel" src="img/pixel.png" alt="Pixel">
              <p id="mensaje" class="globo" role="status" aria-live="polite"></p>
            </div>
            <div id="confeti" class="confeti" aria-hidden="true"></div>
          </div>

          <div id="panel" class="panel">
            <div id="progreso" class="progreso" role="img"></div>
            <p class="rotulo">Piezas</p>
            <div id="bandeja" class="bandeja" aria-label="Piezas disponibles"></div>

            <div id="caja" class="sobrantes" hidden>
              <p class="rotulo">Caja de sobrantes</p>
              <div id="caja-piezas" class="bandeja"></div>
            </div>

            <div class="acciones-juego">
              <button type="button" id="btn-siguiente" class="btn-juego jugar" hidden>Siguiente robot</button>
              <button type="button" id="btn-pista" class="btn-juego">Pista</button>
              <button type="button" id="btn-reiniciar" class="btn-juego">Reiniciar</button>
              <button type="button" id="btn-como" class="btn-juego" aria-label="Cómo se juega">¿Cómo?</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- CÓMO SE JUEGA: demostración animada -->
  <dialog id="tutorial" aria-labelledby="tut-titulo">
    <div class="guia-contenido">
      <h2 id="tut-titulo">Cómo se juega</h2>
      <div id="demo" class="demo-caja robot-demo">
        <div id="demo-taller" class="taller mini" aria-hidden="true"></div>
        <div id="demo-bandeja" class="bandeja" aria-hidden="true"></div>
        <span id="toque" class="toque" hidden></span>
        <div id="demo-confeti" class="confeti" aria-hidden="true"></div>
      </div>
      <p id="demo-texto" class="demo-texto" role="status"></p>
      <div class="demo-nav">
        <button type="button" id="demo-atras" class="btn-juego" aria-label="Paso anterior">&lsaquo;</button>
        <ol id="demo-puntos" class="demo-puntos"></ol>
        <button type="button" id="demo-sig" class="btn-juego" aria-label="Paso siguiente">&rsaquo;</button>
      </div>
      <button type="button" class="boton-secundario cerrar">¡A jugar!</button>
    </div>
  </dialog>

  <!-- FELICITACIÓN FINAL (al completar el robot 10) -->
  <dialog id="final" aria-labelledby="final-titulo">
    <div class="guia-contenido final-contenido">
      <svg class="trofeo" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M18 8h28v16c0 9-6 15-14 15S18 33 18 24z" fill="#ffc933" stroke="#12294a" stroke-width="3" stroke-linejoin="round"/>
        <path d="M18 14H8c0 10 4 16 12 17M46 14h10c0 10-4 16-12 17" fill="none" stroke="#12294a" stroke-width="3" stroke-linecap="round"/>
        <rect x="28" y="39" width="8" height="9" fill="#e8730f" stroke="#12294a" stroke-width="3"/>
        <rect x="19" y="48" width="26" height="8" rx="2" fill="#1a5fb4" stroke="#12294a" stroke-width="3"/>
      </svg>
      <img class="final-pixel" src="img/pixel.png" alt="Pixel">
      <h2 id="final-titulo">¡Lo lograste!</h2>
      <p class="nota">Construiste los 10 robots. ¡Eres un gran inventor!</p>
      <div class="acciones">
        <button type="button" id="btn-otra-vez" class="boton-secundario">Jugar otra vez</button>
        <button type="button" class="boton-secundario cerrar">Cerrar</button>
      </div>
      <div id="final-confeti" class="confeti" aria-hidden="true"></div>
    </div>
  </dialog>

  <!-- La barra de navegación y la ventana de ayuda las agrega js/app.js -->
  <script src="js/app.js"></script>
  <script src="js/robot-niveles.js"></script>
  <script src="js/robot-formas.js"></script>
  <script src="js/robot-logica.js"></script>
  <script src="js/robot-vista.js"></script>
</body>
</html>
