<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Completa el tablero! - Piensa y Ordena</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="actividad2">

  <main id="app">
    <section class="interna" aria-labelledby="titulo-pagina">
      <div class="tarjeta">
        <div class="tarjeta-top">
          <a class="boton-volver" href="mapa.html">Volver al menú</a>
        </div>
        <div class="juego-cabecera">
          <h2 id="titulo-pagina">¡Completa el tablero!</h2>
          <ol id="niveles" class="niveles" aria-label="Desafíos"></ol>
        </div>
        <p id="consigna" class="consigna"></p>

        <div class="camino">
          <div class="zona-tablero">
            <div id="rejilla" class="rejilla" aria-label="Tablero"></div>
            <div id="confeti" class="confeti" aria-hidden="true"></div>
          </div>

          <div id="panel" class="panel">
            <div class="personaje">
              <img id="pixel" src="img/pixel.png" alt="Pixel">
              <p id="mensaje" class="globo" role="status" aria-live="polite"></p>
            </div>

            <p class="rotulo">Figuras</p>
            <div id="bandeja" class="bandeja" aria-label="Figuras disponibles"></div>

            <div class="acciones-juego">
              <button type="button" id="btn-siguiente" class="btn-juego jugar" hidden>Siguiente desafío</button>
              <button type="button" id="btn-pista" class="btn-juego">Pista</button>
              <button type="button" id="btn-reiniciar" class="btn-juego">Reiniciar</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- La barra de navegación y la ventana de ayuda las agrega js/app.js -->
  <script src="js/app.js"></script>
  <script src="js/tablero-niveles.js"></script>
  <script src="js/tablero-logica.js"></script>
  <script src="js/tablero-vista.js"></script>
</body>
</html>
