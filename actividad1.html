<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>¡Encuentra el camino! - Piensa y Ordena</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body data-pagina="actividad1">

  <main id="app">
    <section class="interna" aria-labelledby="titulo-pagina">
      <div class="tarjeta">
        <div class="tarjeta-top">
          <a class="boton-volver" href="mapa.html">Volver al menú</a>
        </div>
        <div class="juego-cabecera">
          <h2 id="titulo-pagina">¡Encuentra el camino!</h2>
          <ol id="niveles" class="niveles" aria-label="Niveles"></ol>
        </div>
        <p id="consigna" class="consigna"></p>

        <div class="camino">
          <div class="zona-tablero">
            <div id="tablero" class="tablero" aria-label="Tablero del juego"></div>
            <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
            <div id="confeti" class="confeti" aria-hidden="true"></div>
          </div>

          <div id="panel" class="panel">
            <div id="flechas" class="flechas" aria-label="Flechas">
              <button type="button" class="flecha-btn" data-dir="arriba" draggable="true" aria-label="Flecha arriba"><svg class="flecha-svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V6M5.5 12.5 12 6l6.5 6.5"/></svg></button>
              <button type="button" class="flecha-btn" data-dir="abajo" draggable="true" aria-label="Flecha abajo"><svg class="flecha-svg f-abajo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V6M5.5 12.5 12 6l6.5 6.5"/></svg></button>
              <button type="button" class="flecha-btn" data-dir="izquierda" draggable="true" aria-label="Flecha a la izquierda"><svg class="flecha-svg f-izquierda" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V6M5.5 12.5 12 6l6.5 6.5"/></svg></button>
              <button type="button" class="flecha-btn" data-dir="derecha" draggable="true" aria-label="Flecha a la derecha"><svg class="flecha-svg f-derecha" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V6M5.5 12.5 12 6l6.5 6.5"/></svg></button>
            </div>

            <p class="rotulo">El camino de Pixel</p>
            <ol id="programa" class="programa" aria-label="Camino de Pixel"></ol>

            <div class="acciones-juego">
              <button type="button" id="btn-siguiente" class="btn-juego jugar" hidden>Siguiente nivel</button>
              <button type="button" id="btn-jugar" class="btn-juego jugar">Jugar</button>
              <button type="button" id="btn-borrar" class="btn-juego">Borrar</button>
              <button type="button" id="btn-reiniciar" class="btn-juego">Reiniciar</button>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- La barra de navegación y la ventana de ayuda las agrega js/app.js -->
  <script src="js/app.js"></script>
  <script src="js/camino-niveles.js"></script>
  <script src="js/camino-logica.js"></script>
  <script src="js/camino-vista.js"></script>
</body>
</html>
