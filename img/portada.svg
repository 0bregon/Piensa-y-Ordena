<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Tres bloques numerados del 1 al 3, unidos por flechas, que llegan a una estrella.</title>

  <rect x="0" y="0" width="480" height="340" rx="24" fill="#e8f3fc"/>

  <!-- Flechas -->
  <g fill="none" stroke="#12294a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M128 250 L160 250 M150 238 L162 250 L150 262"/>
    <path d="M258 190 L290 190 M280 178 L292 190 L280 202"/>
    <path d="M388 130 L408 112 M396 108 L410 110 L408 124"/>
  </g>

  <!-- Bloque 1 -->
  <rect x="30" y="200" width="98" height="100" rx="16" fill="#e8574a"/>
  <text x="79" y="272" font-family="Trebuchet MS, Verdana, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Bloque 2 -->
  <rect x="160" y="140" width="98" height="100" rx="16" fill="#2e9e5b"/>
  <text x="209" y="212" font-family="Trebuchet MS, Verdana, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

  <!-- Bloque 3 -->
  <rect x="290" y="80" width="98" height="100" rx="16" fill="#1a5fb4"/>
  <text x="339" y="152" font-family="Trebuchet MS, Verdana, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <!-- Estrella de la meta -->
  <polygon points="425,28 436,54 464,57 443,76 449,104 425,90 401,104 407,76 386,57 414,54"
           fill="#ffc933" stroke="#12294a" stroke-width="4" stroke-linejoin="round"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
